<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <link rel="stylesheet" href="css/login.css">
   <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <div class="image-head">
            <a href="index.html">HOME</a>
            <img class="head_logo" src="img/Logo.png" alt="logo alura geek">
        </div>
    </header>

    <div class="login-page">
        <div class="form">
          <form class="login-form">
            <input type="text" placeholder="Escriba su correo electrónico"/>
            <input type="password" placeholder="Escriba su contraseña"/>
            <button>Entrar</button>
          </form>
        </div>
      </div>
      <footer class="rodapie">

        <div class="contenido">
            <img class="radapie-logo" src="img/Logo.png" alt="logo alura geek">


            <div class="links">
                <p class="item-qs">Quienes somos</p>
                <p class="item-pp">Política de privacidad</p>
                <p class="item-pf">Programa de fidelidad</p>
                <p class="item-nt">Nuestras Tiendas</p>
                <p class="item-qf">Quiero ser franquiciado</p>
                <p class="item-anuncio">Anúncie aquí</p>
            </div>


           <div class="contacto">
            <h2 class="titulo-hable-nosotros">Hable con nosotros</h2>

            <div class="campos">
                <input class="campo-nombre nombre-placeholder" placeholder="Nombre" type="text">
                <input class="campo-mensaje mensaje-placeholder" placeholder="Escribe tu mensaje" type="text">
                <a class="boton-mensaje" href="#">Enviar mensaje</a>
            </div>
           </div>
        </div>
    </footer>

    <div class="footer">
        <p class="titulo-footer">Desarrollado por Daniela Acevedo 2021</p>
    </div>
       
    
</body>
</html>
